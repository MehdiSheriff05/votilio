{% from '_macros.html' import icon %}<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Votilio{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237b7bff'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='%230a0a14' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
  <link rel="preload" href="{{ url_for('static', filename='fonts/InterVariable.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}?v={{ asset_v }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ asset_v }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" style="{% block body_style %}{% endblock %}">
  {% include '_icons.html' %}
  {% block body %}{% endblock %}
  <div id="toasts" role="status" aria-live="polite"></div>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <div class="dlg-head"><h2 id="confirm-title">Are you sure?</h2></div>
    <div class="dlg-body"><p class="muted" id="confirm-body"></p></div>
    <div class="dlg-foot">
      <button type="button" class="btn" data-confirm-cancel>Cancel</button>
      <button type="button" class="btn btn-danger" data-confirm-ok>Confirm</button>
    </div>
  </dialog>
  {% with messages = get_flashed_messages(with_categories=true) %}
  <script type="application/json" id="flash-data">{{ (messages or [])|tojson }}</script>
  {% endwith %}
  <script src="{{ url_for('static', filename='js/app.js') }}?v={{ asset_v }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
