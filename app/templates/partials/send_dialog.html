<dialog id="send-dialog" aria-labelledby="send-title" data-modal-strict>
  <div class="dlg-head"><h2 id="send-title" data-send-title>Sending</h2></div>
  <div class="dlg-body send-progress">
    <div class="big" data-send-big>0</div>
    <div class="progress"><i data-send-bar style="width:0"></i></div>
    <div class="muted" data-send-sub>Starting…</div>
    <div class="fail-list hide" data-send-fails></div>
  </div>
  <div class="dlg-foot"><button type="button" class="btn btn-primary" data-send-done disabled>Working…</button></div>
</dialog>
